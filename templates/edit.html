{% extends "base.html" %}
{% block title %}Editar producto{% endblock %}
{% block content %}
<section class="hero"><div><p class="eyebrow">ACTUALIZACIÓN</p><h1>Editar producto #{{ product.id }}</h1><p class="muted">Modifica los datos y guarda los cambios.</p></div></section>
<section class="panel">
  <form method="post" class="edit-form">
    <label>Nombre<input name="name" type="text" maxlength="120" value="{{ product.name }}" required></label>
    <label>Precio<input name="price" type="number" min="0" step="0.01" value="{{ product.price }}" required></label>
    <label>Stock<input name="stock" type="number" min="0" step="1" value="{{ product.stock }}" required></label>
    <div class="form-actions"><button type="submit">Guardar cambios</button><a class="cancel" href="{{ url_for('index') }}">Cancelar</a></div>
  </form>
</section>
{% endblock %}
